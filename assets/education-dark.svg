<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="172" viewBox="0 0 1000 172" fill="none" role="img" aria-label="Education and languages">
<title>Education and languages</title>
<style>
.s{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
text{white-space:pre}
</style>
<defs>
<linearGradient id="lvl" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/>
</linearGradient>
</defs>
<g opacity="0" transform="translate(14 10)"><animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.55s" fill="freeze"/>
    <rect x="0" y="0" width="486" height="88" rx="15" fill="#0B1E2E" stroke="#173A54" stroke-width="1.1"/>
    <rect x="1.5" y="16" width="3.5" height="56" rx="1.75" fill="#22D3EE" opacity=".8"/>
    <text x="22" y="34" class="s" font-size="15" fill="#EDF8FD" font-weight="600">Al-Quds University</text>
    <text x="22" y="56" class="s" font-size="12.2" fill="#7FA3BC">BSc Information Technology · Dual Study</text>
    <rect x="22" y="64" width="138.28" height="18" rx="5" fill="#0F2A3E" stroke="#173A54" stroke-width="1"/>
    <text x="91.14" y="76" class="m" font-size="10.2" fill="#22D3EE" text-anchor="middle" letter-spacing="0.8">SEP 2019 — MAR 2024</text>
  </g>
  <g opacity="0" transform="translate(514 10)"><animate attributeName="opacity" from="0" to="1" begin="0.22s" dur="0.55s" fill="freeze"/>
    <rect x="0" y="0" width="486" height="88" rx="15" fill="#0B1E2E" stroke="#173A54" stroke-width="1.1"/>
    <rect x="1.5" y="16" width="3.5" height="56" rx="1.75" fill="#22D3EE" opacity=".8"/>
    <text x="22" y="34" class="s" font-size="15" fill="#EDF8FD" font-weight="600">Mälardalen University, Sweden</text>
    <text x="22" y="56" class="s" font-size="12.2" fill="#7FA3BC">Exchange · International IT Program</text>
    <rect x="22" y="64" width="89.32" height="18" rx="5" fill="#0F2A3E" stroke="#173A54" stroke-width="1"/>
    <text x="66.66" y="76" class="m" font-size="10.2" fill="#22D3EE" text-anchor="middle" letter-spacing="0.8">2022 — 2023</text>
  </g>
<text x="22" y="112" class="m" font-size="10.8" fill="#22D3EE" letter-spacing="1.7">LANGUAGES</text>
  <g transform="translate(14 116)">
    <text x="8" y="20" class="s" font-size="13.5" fill="#EDF8FD" font-weight="600">Arabic</text>
    <text x="298" y="20" class="m" font-size="10.5" fill="#7FA3BC" text-anchor="end" letter-spacing="1">Native</text>
    <rect x="8" y="32" width="290" height="7" rx="3.5" fill="#122E44"/>
    <rect x="8" y="32" width="0" height="7" rx="3.5" fill="url(#lvl)">
      <animate attributeName="width" from="0" to="290" begin="0.3s" dur="1.1s" fill="freeze"/>
    </rect>
  </g>
  <g transform="translate(346 116)">
    <text x="8" y="20" class="s" font-size="13.5" fill="#EDF8FD" font-weight="600">English</text>
    <text x="298" y="20" class="m" font-size="10.5" fill="#7FA3BC" text-anchor="end" letter-spacing="1">Intermediate</text>
    <rect x="8" y="32" width="290" height="7" rx="3.5" fill="#122E44"/>
    <rect x="8" y="32" width="0" height="7" rx="3.5" fill="url(#lvl)">
      <animate attributeName="width" from="0" to="191.4" begin="0.48s" dur="1.1s" fill="freeze"/>
    </rect>
  </g>
  <g transform="translate(678 116)">
    <text x="8" y="20" class="s" font-size="13.5" fill="#EDF8FD" font-weight="600">Swedish</text>
    <text x="298" y="20" class="m" font-size="10.5" fill="#7FA3BC" text-anchor="end" letter-spacing="1">Basic</text>
    <rect x="8" y="32" width="290" height="7" rx="3.5" fill="#122E44"/>
    <rect x="8" y="32" width="0" height="7" rx="3.5" fill="url(#lvl)">
      <animate attributeName="width" from="0" to="87" begin="0.66s" dur="1.1s" fill="freeze"/>
    </rect>
  </g>
