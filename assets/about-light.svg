<rect x="20" y="26" width="3" height="46" rx="1.5" fill="url(#bar)"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.05s" dur="0.55s" fill="freeze"/><text x="38" y="48" class="s" font-size="16.5" fill="#082031" font-weight="600">I build secure, scalable enterprise systems —</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.18s" dur="0.55s" fill="freeze"/><text x="38" y="70" class="s" font-size="16.5" fill="#082031" font-weight="600">and lately, the AI that runs inside them.</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.25s" dur="0.55s" fill="freeze"/><text x="20" y="106" class="s" font-size="13.2" fill="#54798F">Hands-on since 2020, with a BSc in Information Technology from</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.32s" dur="0.55s" fill="freeze"/><text x="20" y="126" class="s" font-size="13.2" fill="#54798F">Al-Quds University (dual study with AXSOS AG) and an exchange</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.39s" dur="0.55s" fill="freeze"/><text x="20" y="146" class="s" font-size="13.2" fill="#54798F">semester at Mälardalen University in Sweden.</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.53s" dur="0.55s" fill="freeze"/><text x="20" y="186" class="s" font-size="13.2" fill="#54798F">Today I work with UNDP on Mizan 3 — the nationwide judicial case</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.55s" fill="freeze"/><text x="20" y="206" class="s" font-size="13.2" fill="#54798F">management platform used across every Palestinian court and</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.67s" dur="0.55s" fill="freeze"/><text x="20" y="226" class="s" font-size="13.2" fill="#54798F">prosecution office. I work end to end: database design, ASP.NET</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.74s" dur="0.55s" fill="freeze"/><text x="20" y="246" class="s" font-size="13.2" fill="#54798F">Core APIs, Angular frontend, containerised deployment and</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.81s" dur="0.55s" fill="freeze"/><text x="20" y="266" class="s" font-size="13.2" fill="#54798F">reporting — and I lead the platform's Core AI Platform.</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.55s" fill="freeze"/><text x="20" y="306" class="s" font-size="13.2" fill="#54798F">All of it runs on-premise, because judicial data doesn't leave</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.02s" dur="0.55s" fill="freeze"/><text x="20" y="326" class="s" font-size="13.2" fill="#54798F">the institution.</text></g>
