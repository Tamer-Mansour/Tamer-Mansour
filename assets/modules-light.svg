    <text x="58" y="34" class="s" font-size="15" fill="#082031" font-weight="600">OCR Microservice &amp; Document Classification</text>
    <text x="58" y="60" class="s" font-size="12.2" fill="#54798F">Digitises incoming case documents, then auto-classifies</text>
    <text x="58" y="78" class="s" font-size="12.2" fill="#54798F">and routes each one to the right case type.</text>
