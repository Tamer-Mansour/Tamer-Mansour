<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="344" viewBox="0 0 1000 344" fill="none" role="img" aria-label="Experience timeline">
<title>Experience timeline</title>
<style>
.s{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
text{white-space:pre}
</style>
<defs>
<linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0B6E82"/><stop offset=".55" stop-color="#1A5276"/>
  <stop offset="1" stop-color="#1A5276" stop-opacity="0"/>
</linearGradient>
</defs>
<rect x="32.5" y="20" width="2.4" height="306" rx="1.2" fill="#DBEAF4"/>
<rect x="32.5" y="20" width="2.4" height="0" rx="1.2" fill="url(#rail)">
  <animate attributeName="height" values="0;0;306;306" keyTimes="0;0.04;0.3;1" dur="11s" repeatCount="indefinite"/>
</rect>
  <g transform="translate(0 16)">
    <circle cx="33.7" cy="42" r="13" fill="#0B6E82" opacity=".18">
      <animate attributeName="r" values="10;18;10" dur="3.2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".22;0;.22" dur="3.2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="33.7" cy="42" r="7.5" fill="#FFFFFF" stroke="#0B6E82" stroke-width="2.6"/>
    <rect x="68" y="0" width="918" height="146" rx="16" fill="#FFFFFF" stroke="#C4DCEC" stroke-width="1.1"/>
    <rect x="92" y="18" width="140.64" height="22" rx="6" fill="#F1F8FC" stroke="#C4DCEC" stroke-width="1"/>
    <text x="162.32" y="33" class="m" font-size="10.8" fill="#0B6E82" text-anchor="middle" letter-spacing="0.9">AUG 2024 — PRESENT</text>
    <text x="92" y="70" class="s" font-size="21" fill="#082031" font-weight="700">UNDP</text>
    <text x="92" y="92" class="s" font-size="13.5" fill="#0E7490" font-weight="500">Full Stack Software Engineer · AI Engineer</text>
    <text x="92" y="116" class="s" font-size="12.2" fill="#54798F">Core contributor to Mizan 3, the nationwide judicial case management platform. I build enterprise</text>
    <text x="92" y="134" class="s" font-size="12.2" fill="#54798F">full-stack modules in ASP.NET Core and Angular, and lead the on-premise Core AI Platform.</text>
  </g>
  <g transform="translate(0 178)">
    <circle cx="33.7" cy="42" r="13" fill="#0B6E82" opacity=".18">
      <animate attributeName="r" values="10;18;10" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".22;0;.22" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="33.7" cy="42" r="7.5" fill="#FFFFFF" stroke="#0B6E82" stroke-width="2.6"/>
    <rect x="68" y="0" width="918" height="146" rx="16" fill="#FFFFFF" stroke="#C4DCEC" stroke-width="1.1"/>
    <rect x="92" y="18" width="95.28" height="22" rx="6" fill="#F1F8FC" stroke="#C4DCEC" stroke-width="1"/>
    <text x="139.64" y="33" class="m" font-size="10.8" fill="#0B6E82" text-anchor="middle" letter-spacing="0.9">2020 — 2024</text>
    <text x="92" y="70" class="s" font-size="21" fill="#082031" font-weight="700">AXSOS AG</text>
    <text x="92" y="92" class="s" font-size="13.5" fill="#0E7490" font-weight="500">Software Development Trainee — Dual Study</text>
    <text x="92" y="116" class="s" font-size="12.2" fill="#54798F">Full stack work across enterprise projects, alternating three months at university with three months</text>
    <text x="92" y="134" class="s" font-size="12.2" fill="#54798F">in the company. Shipped work on APCOA's Europe-wide parking platform and built AXSOS AlgoLab.</text>
  </g>
</svg>
