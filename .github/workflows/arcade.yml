name: arcade

# Renders the contribution grid as two playable-looking animations —
# a snake eating the squares, and Pac-Man munching them — then publishes
# the SVGs to the `output` branch, where README.md points at them.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: arcade
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
          hide_month_labels: "false"

      - name: Snake contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0B6E82&color_dots=#EEF5FA,#BAE6F2,#7FCEE0,#2E9DB5,#0B6E82
            dist/snake-dark.svg?color_snake=#22D3EE&color_dots=#0B1E2E,#164E63,#0E7490,#22D3EE,#67E8F9

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
